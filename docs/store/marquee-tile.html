<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Marquee promo tile</title>
		<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="shots.css" />
		<style>
			.text {
				position: absolute;
				left: 96px;
				top: 110px;
				width: 520px;
			}
			h1 {
				font-size: 56px;
			}
			.keys {
				margin-top: 32px;
			}
			.shot {
				position: absolute;
				left: 690px;
				top: 70px;
				width: 900px;
			}
		</style>
	</head>
	<body class="marquee">
		<div class="text">
			<p class="eyebrow"><img src="../../site/img/icon.png" alt="" />Open in Review</p>
			<h1>Shift+R opens the pull request</h1>
			<p>From GitHub straight into your local review.</p>
			<div class="keys"><kbd>⇧</kbd><kbd>R</kbd></div>
		</div>
		<div class="shot"><img src="../../site/img/review.webp" alt="" /></div>
	</body>
</html>
